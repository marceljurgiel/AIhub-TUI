[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub"
version = "1.5.0"
description = "AIhub — a terminal AI workspace for local and cloud models: chat, agents, skills, MCP, memory"
readme = "README.md"
authors = [{ name = "AIHub Contributors" }]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "psutil>=5.0.0",
    "questionary>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "pypdf>=4.0",
    "anthropic>=0.40.0",
    "huggingface_hub[hf_xet]>=0.30.0",
    "py-cpuinfo>=9.0.0",
    "ddgs>=9.14",
    "mcp>=2.3",
    "wmi>=1.5.1; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aihub-cli = "aihub.cli:app"
aihub-bridge = "aihub.bridge:main"

[tool.setuptools]
packages = ["aihub", "aihub.tools"]
include-package-data = true

[tool.setuptools.package-data]
aihub = ["models_registry.json", "data/*.json", "data/LICENSE-*", "data/skills/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
