[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub-tui"
version = "0.3.13"
description = "AIHub TUI Edition — chat-first Textual terminal interface for local AI model management"
readme = "README.md"
authors = [{ name = "AIHub Contributors" }]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "psutil>=5.0.0",
    "questionary>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.85.0",
    "anthropic>=0.40.0",
    "huggingface_hub[hf_xet]>=0.30.0",
    "gputil>=1.4.0",
    "py-cpuinfo>=9.0.0",
    "wmi>=1.5.1; sys_platform == 'win32'"
]

[project.scripts]
aihub = "aihub.cli:app"

[tool.setuptools]
packages = ["aihub", "aihub.tui", "aihub.tui.widgets", "aihub.tui.modals", "aihub.tools"]
include-package-data = true

[tool.setuptools.package-data]
aihub = ["models_registry.json", "data/*.json", "data/LICENSE-*"]
"aihub.tui" = ["*.tcss"]
