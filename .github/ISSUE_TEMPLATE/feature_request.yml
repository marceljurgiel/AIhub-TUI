name: Idea
description: Something AIhub could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task you have in mind, in your own words — not necessarily how AIhub should do it.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How could it work?
      description: Optional — a key, a window, a slash command, a setting…
  - type: textarea
    id: now
    attributes:
      label: What do you do now instead?
      description: Optional — another tool, a workaround.
